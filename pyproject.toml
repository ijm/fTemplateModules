[build-system]
requires = ["setuptools>=61.0,<75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ftemplatemodules"
version = "0.2.0"
authors = [
  { name="Ian McEwan", email="ijm567@gmail.com" },
]
description = "Use import hooks to read in a template file as if it were a python module object."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["pyparsing>=3.0"]
keywords = ["template", "f-string", "import-hook", "llm-prompts", "latex", "t-string"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/ijm/fTemplateModules"
Documentation = "https://github.com/ijm/fTemplateModules#readme"
Issues = "https://github.com/ijm/fTemplateModules/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
